<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="assets/global.css">
        <link rel="stylesheet" href="assets/generate.css">

        <title>Credit Card Generator</title>
    </head>
    <body>
        <nav class="navbar">
            <div class="navbar-logo">my<span>Card</span></div>

            <button type="button" id="btn-back" class="back-button">
                ← Back to Main
            </button>
        </nav>
        
        <h1>Generate your credit card.</h1>

        <section id="card-generator">
            <form id="generator-form">
                <label for="cardholder-name">Cardholder Name</label>
                <input type="text" id="cardholder-name" name="cardholder-name" placeholder="John Smith" required>
                <label for="card-network">Card Network</label>
                <select id="card-network" name="card-network" required>
                    <option value = "">Select a network</option>
                    <option value = "visa">Visa</option>
                    <option value = "mastercard">Mastercard</option>
                    <option value = "amex">American Express</option>
                    <option value="discover">Discover</option>
                    <option value="unknown">Unknown / Other</option>
                </select>
                <div class="expiration-fields">
                    <div>
                        <label for="expiry-month">Expiration Month</label>
                        <select id="expiry-month" name="expiry-month" required>
                            <option value="">Month</option>
                            <option value="01">01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>
                            <option value="06">06</option>
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>  
                    <div>
                        <label for="expiry-year">Expiration Year</label>
                        <input type="number" id="expiry-year" name="expiry-year" placeholder="YYYY" min="2026" max="2100" required>
                    </div> 
                </div>

                <label for="card-issuer">Issuing Company (Optional)</label>
                <input type="text" id="card-issuer" name="card-issuer" placeholder="CIBC">

                <label for="retail-partnership">Retail Partnership</label>
                <select id="retail-partnership" name="retail-partnership">
                    <option value="none">None / Unknown</option>
                    <option value="costco">Costco</option>
                    <option value="other">Other</option>
                </select>

                <button type="submit">Generate</button>
                <button type="button" id="save-card" class="save-button">Save</button>

                <div id="generator-results" aria-live="polite">
                    Results will appear here.
                </div>
            </form>
        </section>
        <script src="dist/generate.js"></script>
    </body>
</html>
